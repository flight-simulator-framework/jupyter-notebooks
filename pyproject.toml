[project]
name = "flight-jupyter-notebooks"
version = "0.1.0"
description = "Research notebooks, exploratory simulations and MATLAB/Octave experiments."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "wmalek", email = "wiktoria.malek@cern.ch"}]
dependencies = [
    "numpy>=2.4.2,<3",
    "matplotlib>=3.10.8,<4",
    "scipy>=1.17.1,<2",
    "rf-track>=2.6.2,<3",
    "pandas>=3.0.2,<4",
    "h5py>=3,<4",
    "cpymad>=1,<2",
    "scikit-optimize>=0.10,<1",
    "botorch>=0.17,<1",
    "jupyterlab>=4,<5",
    "ipykernel>=6,<8",
    "machine-interfaces[epics,madx,rftrack,tao]>=0.1.0,<0.2.0",
    "flight-response-matrix>=0.1.0,<0.2.0"
]

[project.optional-dependencies]
emittance-analysis = ["flight-emittance-measurement>=0.1.0,<0.2.0"]
gui-experiments = ["PyQt6>=6.10.2,<7", "flight-system-identification>=0.1.0,<0.2.0", "flight-beam-based-alignment>=0.1.0,<0.2.0", "flight-atf2-knobs>=0.1.0,<0.2.0"]
optimization-example = ["xopt>=3.0.0,<4"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
flight-emittance-measurement = {path = "../emittance-measurement", develop = true, optional = true}
machine-interfaces = {path = "../machine-interfaces", develop = true, extras = ["epics", "madx", "rftrack", "tao"]}
flight-response-matrix = {path = "../response-matrix", develop = true}

flight-system-identification = {path = "../system-identification", develop = true, optional = true}
flight-beam-based-alignment = {path = "../beam-based-alignment", develop = true, optional = true}
flight-atf2-knobs = {path = "../atf2-knobs", develop = true, optional = true}

[tool.flight-simulator.migration]
status = "local-execution-ready"
repository-dependencies = ["machine-interfaces", "response-matrix"]
optional-repository-integrations = ["emittance-measurement", "system-identification", "beam-based-alignment", "atf2-knobs"]
