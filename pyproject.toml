[project]
name = "flight-jupyter-notebooks"
version = "0.1.0"
description = "Research notebooks, exploratory simulations and MATLAB/Octave experiments."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "wmalek", email = "wiktoria.malek@cern.ch"}]
dependencies = [
    "numpy>=2.4.2,<3",
    "matplotlib>=3.10.8,<4",
    "scipy>=1.17.1,<2",
    "rf-track>=2.6.2,<3",
    "pandas>=3.0.2,<4",
    "h5py>=3,<4",
    "cpymad>=1,<2",
    "scikit-optimize>=0.10,<1",
    "botorch>=0.17,<1",
    "jupyterlab>=4,<5",
    "ipykernel>=6,<8",
    "machine-interfaces[epics,madx,rftrack,tao] @ git+https://gitlab.cern.ch/flight-simulator/machine-interfaces.git@1fa7fca06f949e085353030f59587a68de7e3baf",
    "flight-response-matrix @ git+https://gitlab.cern.ch/flight-simulator/response-matrix.git@7d8b2b3199e55807758e32e6c08a258b6bbbd63f"
]

[project.optional-dependencies]
emittance-analysis = ["flight-emittance-measurement @ git+https://gitlab.cern.ch/flight-simulator/emittance-measurement.git@4e4bdab9128470d997da2fbf28fff118a033e18f"]
gui-experiments = ["PyQt6>=6.10.2,<7", "flight-system-identification @ git+https://gitlab.cern.ch/flight-simulator/system-identification.git@96d98cea137a25a40337d12f79edfda568b14aa2", "flight-beam-based-alignment @ git+https://gitlab.cern.ch/flight-simulator/beam-based-alignment.git@ffb5bf59dbc9b2fd438c90a7e6e9840441c633f7", "flight-atf2-knobs @ git+https://gitlab.cern.ch/flight-simulator/atf2-knobs.git@74476a132e30289f03fdaa9a2e5a3cbd65ad79a7"]
optimization-example = ["xopt>=3.0.0,<4"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.flight-simulator.migration]
status = "local-execution-ready"
repository-dependencies = ["machine-interfaces", "response-matrix"]
optional-repository-integrations = ["emittance-measurement", "system-identification", "beam-based-alignment", "atf2-knobs"]
