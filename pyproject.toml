[project]
name = "flight-jupyter-notebooks"
version = "0.1.0"
description = "Research notebooks, exploratory simulations and MATLAB/Octave experiments."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "wmalek", email = "wiktoria.malek@cern.ch"}]
dependencies = [
    "numpy>=2.4.2,<3",
    "matplotlib>=3.10.8,<4",
    "scipy>=1.17.1,<2",
    "rf-track>=2.6.2,<3",
    "pandas>=3.0.2,<4",
    "h5py>=3,<4",
    "cpymad>=1,<2",
    "scikit-optimize>=0.10,<1",
    "botorch>=0.17,<1",
    "jupyterlab>=4,<5",
    "ipykernel>=6,<8",
    "machine-interfaces[epics,madx,rftrack,tao] @ git+https://gitlab.cern.ch/flight-simulator/machine-interfaces.git@54490bf072d3db26d98383eeeced1a759e1d4bbb",
    "flight-response-matrix @ git+https://gitlab.cern.ch/flight-simulator/response-matrix.git@61de1dfd2719999c01ed613726483132ff9654ca"
]

[project.optional-dependencies]
emittance-analysis = ["flight-emittance-measurement @ git+https://gitlab.cern.ch/flight-simulator/emittance-measurement.git@e3192787e4f867b7a1b61a2886a67438eb1186f7"]
gui-experiments = ["PyQt6>=6.10.2,<7", "flight-system-identification @ git+https://gitlab.cern.ch/flight-simulator/system-identification.git@cf14104bb7c92a9b3d47e2aa7d23f6dfa7525331", "flight-beam-based-alignment @ git+https://gitlab.cern.ch/flight-simulator/beam-based-alignment.git@e341614b1ddc894f7d0e42cd2a49c375d8055be3", "flight-atf2-knobs @ git+https://gitlab.cern.ch/flight-simulator/atf2-knobs.git@eec2004565e8622a08797058fcee9d6888a930f5"]
optimization-example = ["xopt>=3.0.0,<4"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.flight-simulator.migration]
status = "local-execution-ready"
repository-dependencies = ["machine-interfaces", "response-matrix"]
optional-repository-integrations = ["emittance-measurement", "system-identification", "beam-based-alignment", "atf2-knobs"]
