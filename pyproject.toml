[project]
name = "flight-jupyter-notebooks"
version = "0.2.0"
description = "Research notebooks, exploratory simulations and MATLAB/Octave experiments."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "wmalek", email = "wiktoria.malek@cern.ch"}]
dependencies = [
    "numpy>=2.4.2,<3",
    "matplotlib>=3.10.8,<4",
    "scipy>=1.17.1,<2",
    "rf-track>=2.6.2,<3",
    "pandas>=3.0.2,<4",
    "h5py>=3,<4",
    "scikit-optimize>=0.10,<1",
    "botorch>=0.17,<1",
    "jupyterlab>=4,<5",
    "ipykernel>=6,<8",
    "machine-interfaces>=0.2.0,<0.3",
    "flight-response-matrix>=0.2.0,<0.3",
]

[project.optional-dependencies]
emittance-analysis = [
    "flight-emittance-measurement>=0.2.0,<0.3",
]
gui-experiments = [
    "PyQt6>=6.10.2,<7",
    "flight-system-identification>=0.2.0,<0.3",
    "flight-beam-based-alignment>=0.2.0,<0.3",
    "flight-atf2-knobs>=0.2.0,<0.3",
]
optimization-example = [
    "xopt>=3.0.0,<4",
]
clear = [
    "machine-interfaces-clear>=0.2.0,<0.3",
    "pyda (>=1.1.0,<1.2) ; python_version >= \"3.11\" and python_version < \"4\"",
    "pyda-japc (>=1.1.0,<1.2) ; python_version >= \"3.11\" and python_version < \"4\"",
    "pyrbac (>=1.0,<2) ; python_version >= \"3.11\" and python_version < \"4\"",
    "pyccda (>=1.29.4) ; python_version >= \"3.11\" and python_version < \"4\"",
    "cmmnbuild-dep-manager (>=2.13,<3) ; python_version >= \"3.11\" and python_version < \"4\"",
]
atf2 = [
    "machine-interfaces-atf2>=0.2.0,<0.3",
]
facet2 = [
    "machine-interfaces-facet2>=0.2.0,<0.3",
]
esrf = [
    "machine-interfaces-esrf>=0.2.0,<0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.flight-simulator.migration]
status = "package-registry"
